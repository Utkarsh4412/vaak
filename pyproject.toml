[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaak"
version = "0.1.0-dev"
description = "Local-first multilingual real-time voice agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastrtc[stt]>=0.0.19",
    "av==14.2.0",         # prebuilt cp312-win_amd64 wheel; 14.4.0 lacks one
    "gradio>=4.0,<5.40",  # fastrtc.webrtc imports gradio.wasm_utils, removed in 5.40
    "kokoro-onnx>=0.4.7",
    "loguru>=0.7.3",
    "ollama>=0.4.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "faster-whisper>=1.0.0",
]

[project.scripts]
vaak = "vaak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vaak"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — formatter handles it
    "SIM108", # ternary operator — not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["vaak"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
